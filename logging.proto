syntax = "proto3";

package logging;

service LoggingService {
    rpc LogMessage (LogRequest) returns (LogResponse);
    rpc GetMessages (GetRequest) returns (GetResponse);
}

message LogRequest {
    string uuid = 1;
    string message = 2;
}

message LogResponse {
    bool success = 1;
    string message = 2;  // ✅ Make sure this field exists
}

message GetRequest {}

message GetResponse {
    repeated string messages = 1;
}
